[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppilot"
version = "0.1.0"
description = "ShopPilot: e-commerce operations agent (LangGraph + LangSmith + FastAPI + AWS)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.108",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "fastembed>=0.7.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.4",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.3",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "testcontainers>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
