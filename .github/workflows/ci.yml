name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same user, password and database as the default SHOP_DATABASE_URL in core/config.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shoppilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shoppilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version (3.12) and uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      # Coverage gate: at least 80 percent on policy, tools and guardrails (blueprint step W).
      - run: >-
          uv run pytest tests/unit tests/graph tests/redteam tests/api
          --cov=shoppilot.policy --cov=shoppilot.tools --cov=shoppilot.guardrails
          --cov-report=term-missing --cov-fail-under=80
      # Step N "done when": a run that waits for a human survives a process restart (needs the Postgres service).
      - run: uv run pytest tests/integration/test_checkpoint_resume.py -v
      # Evaluation smoke test: 10 cases on the real model, fails on a wrong refund or an approval bypass.
      # --local: no LangSmith upload, so no LangSmith key is needed. Secrets are not available on pull requests from forks.
      - name: Evaluation smoke test
        if: github.event_name == 'push'
        env:
          SHOP_LLM_PROVIDER: groq
          SHOP_LLM_MODEL: openai/gpt-oss-120b
          SHOP_LLM_API_KEY: ${{ secrets.SHOP_LLM_API_KEY }}
        run: uv run python scripts/run_eval.py --subset smoke --local --gate
