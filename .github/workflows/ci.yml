name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version (3.12) and uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
