name: ci

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same user, password and database as the default SHOP_DATABASE_URL in core/config.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shoppilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shoppilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version (3.12) and uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      # Coverage gate: at least 80 percent on policy, tools and guardrails (blueprint step W).
      - run: >-
          uv run pytest tests/unit tests/graph tests/redteam tests/api
          --cov=shoppilot.policy --cov=shoppilot.tools --cov=shoppilot.guardrails
          --cov-report=term-missing --cov-fail-under=80
      # Step N "done when": a run that waits for a human survives a process restart (needs the Postgres service).
      - run: uv run pytest tests/integration/test_checkpoint_resume.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f infra/docker/Dockerfile -t shoppilot-api:ci .
      # SHOP_ENV=test: no UI mount. No database is given, so the API starts without agent runs and /health must still answer.
      - name: Start the image and check /health
        run: |
          docker run -d --name api -p 8000:8000 -e SHOP_ENV=test shoppilot-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Image must not contain secrets
        run: |
          if docker run --rm --entrypoint sh shoppilot-api:ci -c 'test -e /app/.env'; then echo ".env is inside the image"; exit 1; fi
      # The production compose file is only validated here (nothing is started). A dummy env file stands in for the SSM one.
      - name: Validate docker-compose.prod.yml
        run: |
          sudo touch /run/shoppilot.env
          POSTGRES_PASSWORD=dummy docker compose -f docker-compose.prod.yml config -q
          # the compose file must refuse to start without a database password
          if docker compose -f docker-compose.prod.yml config -q 2>/dev/null; then echo "missing POSTGRES_PASSWORD was accepted"; exit 1; fi
