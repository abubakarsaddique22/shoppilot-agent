llm:
  provider: google
  model: set-in-env
  temperature_decide: 0.0
limits:
  auto_refund_limit_pkr: 3000
  manager_limit_pkr: 15000
  auto_refunds_per_day_pkr: 30000
  refund_window_days: 14
  late_threshold_days: 5
budgets:
  max_tool_calls_read: 6
  max_tool_calls_write: 2
  max_retries: 2
  run_timeout_s: 45
  approval_ttl_hours: 48
logging:
  level: INFO
  dir: logs
